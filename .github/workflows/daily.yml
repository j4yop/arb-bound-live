name: Daily MCX scan

# Ingest today's bhavcopy through TinyFish and commit the result.
#
# Why this exists: the repo's claim is that the verdict comes from live data,
# so a single run proves nothing and a series proves a lot. One commit per
# trading day builds the corpus that turns "we fetched it once" into "it has
# been running".
#
# Cost: the bhavcopy fetch uses TinyFish *Fetch*, which is free ($0.000/url).
# The archive Agent run is metered ($0.016/step) and is NOT scheduled.

on:
  schedule:
    # ~06:15 UTC, after the MCX close and after the day's file is published.
    - cron: "15 6 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-run even if a scan for today already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Scan today
        id: scan
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          if [ -z "$TINYFISH_API_KEY" ]; then
            echo "::error::TINYFISH_API_KEY secret is not set. Add it in"
            echo "::error::repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          # scans/ does not exist in a fresh checkout - it is created by this
          # job - so it must be made before anything is written into it.
          mkdir -p scans
          set -o pipefail
          python -m mcx_live live > scans/today.json 2> scans/today.err
          rc=$?
          cat scans/today.err
          if [ "$rc" -ne 0 ]; then
            echo "::error::the live scan failed; see scans/today.err above"
            exit "$rc"
          fi
          python - <<'PY'
          import json, pathlib
          d = json.load(open("scans/today.json"))
          line = d["summary_line"]
          (pathlib.Path("scans")/f"{d['date']}.json").write_text(
              json.dumps(d, indent=1, default=str))
          print(line)
          print("pairs:", json.dumps(d["verdict_summary"]))
          PY

      - name: Publish the verdict
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
        run: |
          mkdir -p scans
          # A one-day result is not a persistent edge, and the corpus says so by
          # growing. Keep the running index so a reader sees the history.
          python - <<'PY'
          import json, pathlib, subprocess
          scan_dir = pathlib.Path("scans")
          days = sorted(p.stem for p in scan_dir.glob("2*.json"))
          (scan_dir / "index.json").write_text(
              json.dumps({"days": days, "count": len(days)}, indent=1))
          print(f"{len(days)} archived trading days")
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f, because scans/ was previously gitignored and a plain `git add`
          # silently skipped it: the workflow reported success while committing
          # nothing. Belt and braces, since .gitignore no longer lists it.
          git add -f scans/
          if git diff --cached --quiet; then
            echo "::warning::no new scan to commit - was the date already archived?"
          else
            git commit -m "chore: daily MCX scan $(date -u +%F)"
            git push
            echo "committed $(git show --stat --oneline HEAD | head -1)"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Daily MCX scan"
            echo ""
            echo '```'
            tail -5 scans/today.err 2>/dev/null || echo "(no run log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
